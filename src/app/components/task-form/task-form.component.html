<section class="task-form">
  <h2>Thêm công việc</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Tên công việc *
      <input type="text" formControlName="title" placeholder="Ví dụ: Học Angular Router" />
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <small class="error">
          @if (form.controls.title.hasError('required')) {
            Không được để trống.
          } @else if (form.controls.title.hasError('minlength')) {
            Cần tối thiểu 3 ký tự.
          }
        </small>
      }
    </label>

    <label>
      Mô tả
      <textarea formControlName="description" rows="2"
        placeholder="Chi tiết công việc (tùy chọn)"></textarea>
      @if (form.controls.description.touched && form.controls.description.hasError('maxlength')) {
        <small class="error">Tối đa 200 ký tự.</small>
      }
    </label>

    <button type="submit" [disabled]="form.invalid">Thêm công việc</button>
  </form>
</section>
